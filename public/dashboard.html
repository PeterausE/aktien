<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aktienaufstellung – Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Aktienaufstellung</h1>
    <div class="topbar-right">
      <span id="current-user"></span>
      <button id="logout-btn">Abmelden</button>
    </div>
  </header>

  <main class="dashboard">
    <section class="filters">
      <label>
        Depot
        <select id="filter-depot">
          <option value="">Alle</option>
        </select>
      </label>
      <label>
        Assetklasse
        <select id="filter-assetklasse">
          <option value="">Alle</option>
        </select>
      </label>
      <div class="timeframe-buttons" id="timeframe-buttons">
        <button data-timeframe="1w">1W</button>
        <button data-timeframe="1m">1M</button>
        <button data-timeframe="3m">3M</button>
        <button data-timeframe="1y">1Y</button>
        <button data-timeframe="all" class="active">Gesamt</button>
      </div>
    </section>

    <section class="chart-section">
      <canvas id="portfolio-chart"></canvas>
    </section>

    <section class="positions-section">
      <table id="positions-table">
        <thead>
          <tr>
            <th>Depot</th>
            <th>Wertpapier</th>
            <th>ISIN</th>
            <th>Assetklasse</th>
            <th>Menge</th>
            <th>Kaufpreis</th>
            <th>Aktueller Wert</th>
            <th>Gewinn/Verlust</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="js/auth.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
